<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>香煌祭 - リアルタイムランキング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0b0f19 0%, #1a0b2e 100%);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 30px 20px;
    overflow-x: hidden;
    position: relative;
  }

  /* レーザーラインを表現する背景アニメーション */
  .laser-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    opacity: 0.3;
    pointer-events: none;
  }

  .laser-beam {
    position: absolute;
    width: 2px;
    height: 200px;
    background: linear-gradient(to bottom, transparent, #00ffcc, transparent);
    animation: moveLaser 3s infinite linear;
  }

  .laser-beam:nth-child(1) { left: 20%; animation-duration: 2.2s; animation-delay: 0s; }
  .laser-beam:nth-child(2) { left: 50%; animation-duration: 1.5s; animation-delay: 0.7s; }
  .laser-beam:nth-child(3) { left: 80%; animation-duration: 2.8s; animation-delay: 1.2s; }
  .laser-beam:nth-child(4) { left: 35%; animation-duration: 1.8s; animation-delay: 0.4s; }

  @keyframes moveLaser {
    0% { transform: translateY(-200px); opacity: 0; }
    50% { opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 700px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 香煌祭のタイトル */
  .koukousai-title {
    font-family: "Yuji Syuku", serif;
    font-size: 44px;
    color: #ffffff;
    text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
    margin-bottom: 2px;
    text-align: center;
  }

  .subtitle {
    font-size: 14px;
    color: #00ffcc;
    letter-spacing: 3px;
    margin-bottom: 25px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
  }

  /* ランキングテーブル */
  .ranking-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(15, 23, 42, 0.85);
    border: 1px solid rgba(0, 255, 204, 0.3);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
  }

  .ranking-table th, .ranking-table td {
    padding: 14px 16px;
    text-align: center;
    font-size: 16px;
  }

  .ranking-table th {
    background: rgba(0, 255, 204, 0.15);
    color: #00ffcc;
    font-weight: bold;
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(0, 255, 204, 0.3);
  }

  .ranking-table tr {
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    transition: background 0.2s;
  }

  .ranking-table tr:hover {
    background: rgba(0, 255, 204, 0.05);
  }

  /* 1位〜3位の特別な装飾 */
  .rank-1 { color: #ffd700; font-weight: bold; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
  .rank-2 { color: #c0c0c0; font-weight: bold; text-shadow: 0 0 10px rgba(192, 192, 192, 0.5); }
  .rank-3 { color: #cd7f32; font-weight: bold; text-shadow: 0 0 10px rgba(205, 127, 50, 0.5); }

  .time-text {
    font-family: monospace;
    color: #00ffcc;
    font-weight: bold;
    font-size: 18px;
  }

  .loading {
    margin-top: 40px;
    color: #94a3b8;
    font-size: 15px;
    letter-spacing: 1px;
    animation: pulse 1.5s infinite;
  }

  @keyframes pulse {
    0% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
  }
</style>
</head>
<body>

<div class="laser-bg">
    <div class="laser-beam"></div>
    <div class="laser-beam"></div>
    <div class="laser-beam"></div>
    <div class="laser-beam"></div>
</div>

<div class="container">
    <h1 class="koukousai-title">香煌祭</h1>
    <div class="subtitle">REALTIME RANKING TOP 10</div>

    <table class="ranking-table">
        <thead>
            <tr>
                <th style="width: 15%;">順位</th>
                <th style="width: 35%;">コードネーム</th>
                <th style="width: 20%;">難易度</th>
                <th style="width: 30%;">タイム</th>
            </tr>
        </thead>
        <tbody id="ranking-body">
            </tbody>
    </table>

    <div id="loading-msg" class="loading">ランキングデータを読み込み中...</div>
</div>

<script>
  // ★さっき発行した新しいスプレッドシートのウェブアプリURLをここにセット！
  const SHEET_API_URL = 'https://script.google.com/macros/s/AKfycbxu_c35sE8gFH-r7MXEpWz6cjh86cO_RyOkPJSbVOTV0OfRoO6pEm-ABlIc-KLvKFn0/exec';

  async function fetchRanking() {
    try {
      const response = await fetch(SHEET_API_URL);
      const data = await response.json(); 

      // タイム順（速い順）に並べ替え
      data.sort((a, b) => a.clearTime.localeCompare(b.clearTime));

      const tbody = document.getElementById('ranking-body');
      tbody.innerHTML = '';

      // 上位10件までを表示
      const top10 = data.slice(0, 10);

      if (top10.length === 0) {
        document.getElementById('loading-msg').textContent = 'まだクリアデータがありません';
        return;
      }

      document.getElementById('loading-msg').style.display = 'none';

      top10.forEach((row, index) => {
        let rankClass = '';
        if (index === 0) rankClass = 'rank-1';
        else if (index === 1) rankClass = 'rank-2';
        else if (index === 2) rankClass = 'rank-3';

        // 「タイム: 01:23:45」から「01:23:45」部分だけを綺麗に取り出す
        let cleanTime = row.clearTime.replace('タイム: ', '').trim();

        let tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="${rankClass}">${index + 1}位</td>
          <td style="font-weight: bold; color: #fff;">${escapeHtml(row.codename)}</td>
          <td><span style="padding: 2px 8px; border-radius: 4px; font-size: 12px; background: ${row.difficulty === 'HARD' ? 'rgba(255, 51, 102, 0.2); color: #ff3366; border: 1px solid #ff3366;' : 'rgba(0, 255, 204, 0.2); color: #00ffcc; border: 1px solid #00ffcc;'}">${row.difficulty}</span></td>
          <td class="time-text">${escapeHtml(cleanTime)}</td>
        `;
        tbody.appendChild(tr);
      });

    } catch (err) {
      console.log('取得エラー', err);
      document.getElementById('loading-msg').textContent = 'ランキングの読み込みに失敗しました';
    }
  }

  // HTMLエスケープ（安全対策）
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&'`<>"]/g, match => ({
      '&': '&amp;', "'": '&#x27;', '`': '&#x60;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
    }[match]));
  }

  // ページを開いたときと、以降「5秒ごと」に自動でランキングを最新に更新！
  fetchRanking();
  setInterval(fetchRanking, 5000);
</script>

</body>
</html>
